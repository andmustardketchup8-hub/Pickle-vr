name: Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version written into the release tag
        required: false
        default: 1.2.0

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest

    # The game itself, defined once here rather than typed into each step.
    env:
      GAME_URL: https://pure-hand-vr.base44.app/play
      PACKAGE: com.picklevr.game

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Android SDK is driven directly here.
      #
      # android-actions/setup-android is not used: its default package list asks
      # for the retired "tools" package, which the current sdkmanager cannot
      # find and fails on, and pinning a cmdline-tools version makes it reject
      # the SDK the runner image already ships. Neither belongs in the build.
      - name: Set up the Android SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME"

          # Use the command-line tools already on the image, wherever they sit.
          CMDLINE="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin 2>/dev/null | head -n 1 || true)"
          if [ -n "$CMDLINE" ]; then
            export PATH="$CMDLINE:$PATH"
          fi

          # No tools at all: install the official command-line tools package.
          if ! command -v sdkmanager > /dev/null; then
            echo "sdkmanager not found — installing the Android command-line tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf /tmp/cmdline-tools
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          fi

          export PATH="$ANDROID_HOME/platform-tools:$PATH"

          # Both names, for every tool that reads one or the other.
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$(command -v sdkmanager)")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "sdkmanager $(sdkmanager --version)"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --list_installed | grep -E "platforms;android-34|build-tools;34.0.0|platform-tools"

      # One certificate for every build. The key is created on the first run and
      # committed, so every later build signs with exactly the same certificate
      # and installs straight over the previous version.
      - name: Keep one signing key for every build
        run: |
          set -euo pipefail
          if [ -f signing/release.keystore ]; then
            echo "Reusing the signing key already in the repository."
            exit 0
          fi

          mkdir -p signing
          keytool -genkeypair -v \
            -keystore signing/release.keystore \
            -storetype PKCS12 \
            -alias picklevr \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass picklevr-release \
            -keypass picklevr-release \
            -dname "CN=Pickle VR, O=Pickle VR, C=US"

          git config user.name "pickle-vr-build"
          git config user.email "build@users.noreply.github.com"
          git add signing/release.keystore
          git commit -m "Add the Pickle VR release signing key"
          git push

      # A keystore that cannot be opened fails the whole build at signing time
      # with a stack trace. Checked here first, so the reason is unmistakable.
      - name: Check the signing key
        run: |
          set -euo pipefail
          if ! keytool -list -keystore signing/release.keystore \
            -storepass picklevr-release -alias picklevr > /dev/null; then
            echo "::error::signing/release.keystore cannot be opened with the build's password and alias. Delete it from the repository and run the build again so a fresh key is created."
            exit 1
          fi
          echo "The release key is readable."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Every release has to out-rank the one already on the headset, or the
      # headset refuses it as a downgrade.
      - name: Work out the version code
        id: versioncode
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          MAJOR="$(printf '%s' "$VERSION" | cut -d. -f1)"
          MINOR="$(printf '%s' "$VERSION" | cut -d. -f2)"
          PATCH="$(printf '%s' "$VERSION" | cut -d. -f3)"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          CODE=$(( (10#$MAJOR * 10000) + (10#$MINOR * 100) + (10#$PATCH) ))

          # The run number only ever goes up, so it is the floor: a build can
          # never ship a version code below one already used.
          if [ "$CODE" -lt ${{ github.run_number }} ]; then
            CODE=${{ github.run_number }}
          fi

          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION -> versionCode $CODE"

      # The Android project is written here, at build time, so the repository
      # carries no generated Gradle files to drift out of date. It is a small
      # native shell: the game itself stays the web app it already is.
      - name: Write the Android project
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/picklevr/game app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }

          dependencyResolutionManagement {
            repositories {
              google()
              mavenCentral()
            }
          }

          rootProject.name = 'PickleVR'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.4.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }

          // Read once, into plain values: passing an expression straight into
          // versionCode makes Groovy call it instead of assigning it.
          def appCode = (project.findProperty('appVersionCode') ?: '1').toString().toInteger()
          def appName = (project.findProperty('appVersionName') ?: '1.0.0').toString()

          android {
            namespace 'com.picklevr.game'
            compileSdk 34

            defaultConfig {
              applicationId 'com.picklevr.game'
              minSdk 29
              targetSdk 34
              versionCode appCode
              versionName appName
            }

            // Signed with the key committed to the repository, so an update
            // installs over the previous build instead of clashing with it.
            signingConfigs {
              release {
                storeFile file('../signing/release.keystore')
                storePassword 'picklevr-release'
                keyAlias 'picklevr'
                keyPassword 'picklevr-release'
              }
            }

            buildTypes {
              release {
                signingConfig signingConfigs.release
                minifyEnabled false
              }
            }

            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.INTERNET" />

            <application
              android:label="@string/app_name"
              android:allowBackup="true">

              <meta-data
                android:name="com.oculus.supportedDevices"
                android:value="quest|quest2|quest3|questpro" />

              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="app_name">Pickle VR</string>
            <string name="game_url">$GAME_URL</string>
          </resources>
          EOF

          cat > app/src/main/java/com/picklevr/game/MainActivity.java <<'EOF'
          package com.picklevr.game;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;

          /**
           * Pickle VR is a WebXR app: its world is drawn by a WebXR runtime, and
           * an Android WebView has none — a wrapped page can only show a flat
           * panel with no way into VR. So this shell hands the game's own URL to
           * the system browser (Quest Browser), which does have one, and the 3D
           * lobby comes up as the real thing.
           */
          public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);

              Intent game = new Intent(
                Intent.ACTION_VIEW,
                Uri.parse(getString(R.string.game_url))
              );
              game.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              startActivity(game);

              finish();
            }
          }
          EOF

          echo "Project written:"
          find app -type f | sort
          echo "--- app/build.gradle ---"
          sed -n '1,60p' app/build.gradle

      - name: Build the APK
        run: |
          set -euo pipefail
          gradle assembleRelease --no-daemon --stacktrace \
            -PappVersionCode="${{ steps.versioncode.outputs.code }}" \
            -PappVersionName="${{ inputs.version }}"
          ls -l app/build/outputs/apk/release/

      # The package name, the version and the signing certificate are read back
      # out of the finished APK, so a wrong one shows up here instead of on a
      # headset.
      - name: Name and check the build
        run: |
          set -euo pipefail
          APK="PickleVR-${{ inputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          ls -l "$APK"

          TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          "$TOOLS/aapt" dump badging "$APK" | grep -E "^package|^application-label|^launchable-activity" || true
          "$TOOLS/apksigner" verify --print-certs "$APK" | head -3 || true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Pickle VR v${{ inputs.version }}
          files: PickleVR-*.apk
          body: |
            Meta Quest build v${{ inputs.version }} (versionCode ${{ steps.versioncode.outputs.code }}).

            Signed with the same key as every previous build, so it installs
            straight over the version already on the headset — no uninstall, and
            saved progress is kept.
