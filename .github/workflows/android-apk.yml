name: Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version written into the release tag
        required: false
        default: 0.0.0

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Android SDK is driven directly here.
      #
      # android-actions/setup-android is not used: its default package list asks
      # for the retired "tools" package, which the current sdkmanager cannot
      # find and fails on, and pinning a cmdline-tools version makes it reject
      # the SDK the runner image already ships. Neither belongs in the build.
      #
      # The hosted runner already carries a full SDK. This step points the build
      # at it, installs the command-line tools only if they are somehow absent,
      # accepts the licences, and installs the exact platform and build tools the
      # Capacitor 6 / AGP 8.2.1 template compiles against.
      - name: Set up the Android SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME"

          # Use the command-line tools already on the image, wherever they sit.
          CMDLINE="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin 2>/dev/null | head -n 1 || true)"
          if [ -n "$CMDLINE" ]; then
            export PATH="$CMDLINE:$PATH"
          fi

          # No tools at all: install the official command-line tools package.
          if ! command -v sdkmanager > /dev/null; then
            echo "sdkmanager not found — installing the Android command-line tools"
            curl -fsSL -o /tmp/cmdline-tools.zip               https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf /tmp/cmdline-tools
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          fi

          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

          # Both names, for every tool that reads one or the other.
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$(command -v sdkmanager)")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "sdkmanager $(sdkmanager --version)"

          # Licences first, then the packages themselves.
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --list_installed | grep -E "platforms;android-34|build-tools;34.0.0|platform-tools"

      # AGP 8.2.1 needs a JDK 17 toolchain; this prints the pair actually in use.
      - name: Check the toolchain
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          node --version

      - name: Prepare the wrapper
        run: |
          mkdir -p wrapper/www
          cat > wrapper/www/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Pickle VR</title>
          </head>
          <body style="margin:0;background:#070a0d;color:#ffffff;font-family:sans-serif">
          <p style="padding:24px">Connecting to Pickle VR...</p>
          </body>
          </html>
          HTML

      - name: Install Capacitor
        working-directory: wrapper
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Configure the app
        working-directory: wrapper
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.picklevr.game",
            "appName": "Pickle VR",
            "webDir": "www",
            "server": { "url": "https://pure-hand-vr.base44.app/play", "androidScheme": "https" },
            "android": { "allowMixedContent": false }
          }
          JSON

      - name: Add the Android platform
        working-directory: wrapper
        run: npx cap add android

      - name: Point Gradle at the SDK
        working-directory: wrapper
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build the APK
        working-directory: wrapper/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the build
        run: cp wrapper/android/app/build/outputs/apk/debug/app-debug.apk "PickleVR-${{ inputs.version }}.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Pickle VR v${{ inputs.version }}
          files: PickleVR-*.apk
          body: Android build v${{ inputs.version }}. Sideload it on Meta Quest.
