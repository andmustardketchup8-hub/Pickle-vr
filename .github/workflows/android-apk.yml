name: Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version written into the release tag
        required: false
        default: 1.9.0

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The runtime that makes this a Quest app instead of a browser tab: V8 for
      # the game's JavaScript, WebGL 2 on the headset's own GLES driver, and
      # WebXR over OpenXR. It is checked out beside the game and compiled here.
      - name: Checkout the OpenXR runtime
        uses: actions/checkout@v7
        with:
          repository: Srile/webxr-to-native
          ref: 5de044b0ab890e373dfd122e90590b3626a9f43f
          path: host-runtime

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The packager turns the splash image into the PNG the headset shows from
      # launch until the game's first frame, and it does that with ImageMagick.
      # The runners ship ImageMagick 6, whose command is convert, so the name the
      # packager calls is pointed at it. Without this the pack fails before it
      # ever reaches the game.
      - name: Image tools for the splash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          if ! command -v magick > /dev/null 2>&1; then
            sudo ln -sf "$(command -v convert)" /usr/local/bin/magick
          fi
          magick -version | head -2

      # The runtime's toolchain is a repo-local SDK, NDK and V8: about 3 GB. The
      # runner image carries a second Android SDK we never use, so it goes first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android || true
          df -h /

      # One certificate for every build. The key is created on the first run and
      # committed, so every later build signs with exactly the same certificate
      # and installs straight over the previous version.
      - name: Keep one signing key for every build
        run: |
          set -euo pipefail
          if [ -f signing/release.keystore ]; then
            echo "Reusing the signing key already in the repository."
            exit 0
          fi

          mkdir -p signing
          keytool -genkeypair -v \
            -keystore signing/release.keystore \
            -storetype PKCS12 \
            -alias picklevr \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass picklevr-release \
            -keypass picklevr-release \
            -dname "CN=Pickle VR, O=Pickle VR, C=US"

          git config user.name "pickle-vr-build"
          git config user.email "build@users.noreply.github.com"
          git add signing/release.keystore
          git commit -m "Add the Pickle VR release signing key"
          git push

      - name: Check the signing key
        run: |
          set -euo pipefail
          if ! keytool -list -keystore signing/release.keystore \
            -storepass picklevr-release -alias picklevr > /dev/null; then
            echo "::error::signing/release.keystore cannot be opened with the build's password and alias. Delete it from the repository and run the build again so a fresh key is created."
            exit 1
          fi
          echo "The release key is readable."

      # The game the APK carries: the offline bundle committed in this repository,
      # in the game folder. Nothing is downloaded and nothing has to be published
      # first, so the APK is always built from exactly the game that was tested.
      #
      # Everything below is checked against the files that are actually present:
      # the page's own script and stylesheet tags, the models, and the absence of
      # any network reference. bundle.json — the bundle's inventory — is WRITTEN
      # from that list rather than kept by hand. It used to be kept by hand and
      # drifted, so an APK shipped an inventory naming an older build's files.
      - name: Check the game bundle
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/game-bundle.mjs" <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const root = "game";
          const fail = (message) => {
            console.error("::error::" + message);
            process.exit(1);
          };

          const walk = (dir, base) => {
            const prefix = base || "";
            const found = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const rel = prefix ? prefix + "/" + entry.name : entry.name;
              if (entry.isDirectory()) found.push(...walk(path.join(dir, entry.name), rel));
              else found.push(rel);
            }
            return found;
          };

          // What the page itself asks for: its module and its stylesheet. Read
          // from the page's own tags, so the inventory can only ever name files
          // this build really references.
          const quote = String.fromCharCode(34);
          const html = fs.readFileSync(path.join(root, "index.html"), "utf8");
          const referenced = html
            .split(quote)
            .map((value) => (value.startsWith("./") ? value.slice(2) : value))
            .filter((value) => value.startsWith("assets/") && (value.endsWith(".js") || value.endsWith(".css")))
            .sort();
          if (!referenced.length) fail("game/index.html loads no script or stylesheet.");
          for (const file of referenced) {
            if (!fs.existsSync(path.join(root, file))) {
              fail("game/index.html loads " + file + ", which is not in the bundle.");
            }
          }

          const models = fs.readdirSync(path.join(root, "models")).filter((name) => name.endsWith(".glb")).sort();
          if (models.length < 4) fail("The bundle holds " + models.length + " models; the game needs all four.");

          // Offline: no external asset may be referenced anywhere in the bundle.
          const stop = new Set(
            [32, 9, 10, 34, 39, 40, 41, 60, 62, 44, 59, 96].map((code) => String.fromCharCode(code))
          );
          const urls = (text) => {
            const found = [];
            for (const prefix of ["https://", "http://"]) {
              let index = text.indexOf(prefix);
              while (index !== -1) {
                let end = index;
                while (end < text.length && !stop.has(text[end])) end += 1;
                found.push(text.slice(index, end));
                index = text.indexOf(prefix, end);
              }
            }
            return found;
          };

          const external = [];
          const sources = walk(root).filter(
            (name) => name.endsWith(".js") || name.endsWith(".css") || name.endsWith(".html")
          );
          for (const file of sources) {
            for (const url of urls(fs.readFileSync(path.join(root, file), "utf8"))) {
              if (url.startsWith("http://www.w3.org") || url.startsWith("https://www.w3.org")) continue;
              if (url.startsWith("http://react.dev") || url.startsWith("https://react.dev")) continue;
              external.push(file + ": " + url);
            }
          }
          if (external.length) fail("The bundle reaches the network: " + external.slice(0, 3).join(", "));

          // The inventory, written from the files on disk, then read back.
          const all = walk(root).filter((file) => file !== "bundle.json").sort();
          const manifest = {
            version: 1,
            note: "The offline Pickle VR bundle the Android build packs into the APK: index.html, its assets, and the models under models/.",
            files: all.filter((file) => !file.startsWith("models/")),
            models: all.filter((file) => file.startsWith("models/")).map((file) => file.slice("models/".length)),
          };
          fs.writeFileSync(path.join(root, "bundle.json"), JSON.stringify(manifest, null, 2));

          const written = JSON.parse(fs.readFileSync(path.join(root, "bundle.json"), "utf8"));
          const listed = [...written.files, ...written.models.map((name) => "models/" + name)];
          const missing = listed.filter((file) => !fs.existsSync(path.join(root, file)));
          if (missing.length) fail("bundle.json lists files that are not in the bundle: " + missing.join(", "));

          console.log("The game bundle: " + listed.length + " files, every one present, no network references.");
          for (const file of listed) {
            console.log("  " + file + "  " + fs.statSync(path.join(root, file)).size + " bytes");
          }
          NODE
          node "$RUNNER_TEMP/game-bundle.mjs"

      # How the runtime is told to run it: the game's folder, the headset session
      # opened on launch (there is no browser and no page chrome to click), and
      # Canvas 2D text, which the game's own plates and readouts are drawn with.
      #
      # The splash is named the way the packager writes it into the APK —
      # assets/vr_splash.png — so the host.json carried inside the APK points at
      # a file that is really in it. The source image is staged under that name
      # first: it used to be splash.png, and the packaged host.json kept that
      # name while the APK itself held vr_splash.png.
      - name: Point the runtime at the game
        run: |
          set -euo pipefail
          mkdir -p native
          if [ ! -f native/vr_splash.png ] && [ -f native/splash.png ]; then
            cp native/splash.png native/vr_splash.png
          fi
          test -f native/vr_splash.png || {
            echo "::error::The splash image is missing: put it at native/vr_splash.png."
            exit 1
          }
          cat > native/host.json <<EOF
          {
            "app": {
              "name": "Pickle VR",
              "package": "com.picklevr.game",
              "version": "${{ inputs.version }}",
              "splash": "vr_splash.png"
            },
            "mode": "js",
            "web": {
              "dist": "../game",
              "origin": "https://pickle.vr",
              "canvasText": true
            },
            "xr": {
              "autoEnter": true
            }
          }
          EOF
          cat native/host.json

      - name: Install the runtime's build tools
        working-directory: host-runtime
        run: |
          set -euo pipefail
          npm ci
          bash tools/setup.sh

      # Compiles the native host for arm64 and packages the APK around the game:
      # the game in assets/www, the runtime as lib/arm64-v8a/libwebxrhost.so.
      - name: Build and sign the VR app
        working-directory: host-runtime
        env:
          KEYSTORE_PASS: picklevr-release
          KEYSTORE_ALIAS: picklevr
        run: |
          set -euo pipefail
          node tools/pack.mjs ../native/host.json --release \
            --keystore ../signing/release.keystore \
            --out "../PickleVR-${{ inputs.version }}.apk"

      # Read back out of the finished APK: that it is a Quest VR app, who signed
      # it, and that the game and the runtime are both inside it.
      - name: Check the APK
        run: |
          set -euo pipefail
          APK="PickleVR-${{ inputs.version }}.apk"
          ls -lh "$APK"

          source host-runtime/tools/env.sh
          TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$TOOLS/aapt" dump badging "$APK" | grep -E "^package|^launchable-activity|uses-feature" | head -10 || true
          "$TOOLS/apksigner" verify --print-certs "$APK" | head -3 || true

          echo "The game inside the APK:"
          unzip -l "$APK" | grep -E "assets/www/(index.html|models/)" | head -8

          for need in "assets/www/index.html" "assets/www/models/pistol.glb" "lib/arm64-v8a/libwebxrhost.so"; do
            unzip -l "$APK" | grep -q "$need" || {
              echo "::error::The APK is missing $need."
              exit 1
            }
          done
          echo "The APK carries the game and the OpenXR runtime."

          # The manifests read back out of the finished APK. Every file
          # bundle.json lists, every script and stylesheet index.html loads, and
          # the splash host.json names all have to be in the APK — and the host's
          # entry point has to be the JavaScript that was actually packed. A
          # manifest describing a different build than the one packed is exactly
          # the fault this check exists to catch.
          unzip -p "$APK" assets/www/bundle.json > "$RUNNER_TEMP/apk-bundle.json"
          cat > "$RUNNER_TEMP/check-apk.mjs" <<'NODE'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";

          const apk = process.argv[2];
          const fail = (message) => {
            console.error("::error::" + message);
            process.exit(1);
          };

          const newline = String.fromCharCode(10);
          const entries = execFileSync("unzip", ["-Z1", apk], { encoding: "utf8" }).split(newline).filter(Boolean);
          const game = new Set(
            entries.filter((name) => name.startsWith("assets/www/")).map((name) => name.slice("assets/www/".length))
          );

          const manifest = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const listed = [...manifest.files, ...manifest.models.map((name) => "models/" + name)];
          const missing = listed.filter((file) => !game.has(file));
          if (missing.length) fail("bundle.json lists files that are not in the APK: " + missing.join(", "));

          const html = execFileSync("unzip", ["-p", apk, "assets/www/index.html"], { encoding: "utf8" });
          const refs = html
            .split(String.fromCharCode(34))
            .map((value) => (value.startsWith("./") ? value.slice(2) : value))
            .filter((value) => value.startsWith("assets/") && (value.endsWith(".js") || value.endsWith(".css")));
          if (!refs.length) fail("The APK's index.html loads no script or stylesheet.");
          const broken = refs.filter((ref) => !game.has(ref));
          if (broken.length) fail("index.html loads files that are not in the APK: " + broken.join(", "));

          const host = JSON.parse(execFileSync("unzip", ["-p", apk, "assets/host.json"], { encoding: "utf8" }));
          const splash = "assets/" + host.app.splash;
          if (!entries.includes(splash)) fail("host.json names a splash that is not in the APK: " + splash);
          if (!game.has(host.web.entry)) fail("The host's entry point is not in the APK: " + host.web.entry);

          console.log("bundle.json: " + listed.length + " files, all present in the APK");
          console.log("index.html loads: " + refs.join(", "));
          console.log("entry: " + host.web.entry + " (present)");
          console.log("splash: " + splash);
          NODE
          node "$RUNNER_TEMP/check-apk.mjs" "$APK" "$RUNNER_TEMP/apk-bundle.json"

      # The built APK, kept with the run itself. The release is the copy a player
      # downloads; this is the copy of the run that produced it, so a build can be
      # checked without going through the release page — and the run's Artifacts
      # section is never empty again.
      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: PickleVR-${{ inputs.version }}
          path: PickleVR-*.apk
          if-no-files-found: error

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: Pickle VR v${{ inputs.version }}
          files: PickleVR-*.apk
          body: |
            Meta Quest build v${{ inputs.version }}.

            A native Quest app: it opens from the Quest library straight into the
            headset's OpenXR session, with no browser, no address bar and no
            website. The whole game — the lobby, every sandbox map, every story
            chapter, the models and the sounds — is inside the APK and read from
            the headset itself, so it plays with no network.

            Signed with the same key as every previous build, so it installs
            straight over the version already on the headset.
